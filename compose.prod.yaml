services:
  postgres:
    image: postgres:16
    container_name: iot-postgres
    restart: always
    environment:
      # POSTGRES_PASSWORD là mật khẩu superuser `postgres` — chỉ dùng quản trị, backend KHÔNG dùng.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env (xem .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-secure_smart_home_iot}
      # Hai biến dưới do infra/postgres/init/00_init.sh đọc (image postgres bỏ qua): role ứng dụng
      # không phải superuser, sở hữu database và chạy 001_schema.sql.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-secure_smart_home_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Thiếu POSTGRES_APP_PASSWORD trong .env (xem .env.example)}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Script init chỉ chạy khi pg_data còn trống; schema mount riêng (chỉ đọc) để 00_init.sh gọi bằng role app.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/migrations:/schema:ro
    networks:
      - iot-network
    healthcheck:
      # -h 127.0.0.1 (TCP) là bắt buộc: server tạm của giai đoạn init chỉ nghe unix socket, nếu
      # pg_isready dùng socket thì báo "ready" sớm, backend khởi động trước khi schema được nạp xong.
      # Đọc biến trong container — không để mật khẩu trong docker inspect (pg_isready không cần mật khẩu).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_APP_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker MQTT: Gateway ↔ Backend — chỉ MQTT over TLS hai chiều (mTLS, port 8883) + ACL theo CN chứng chỉ client.
  # Chạy infra/pki/gen_mqtt_certs.sh <IP/hostname broker> trước lần up đầu tiên; mỗi gateway cần cert client
  # (infra/pki/gen_mqtt_client.sh <gateway_id>). Đổi acl/CRL → docker compose -f compose.prod.yaml restart mqtt-broker.
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    restart: always
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      # ca.key không mount vào container nào
      - ./infra/mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./infra/mosquitto/certs/ca.crl:/mosquitto/certs/ca.crl:ro
      - ./infra/mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./infra/mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - iot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    volumes:
      - ./infra/mosquitto/certs/ca.crt:/certs/mqtt-ca.crt:ro
      # Chứng chỉ client MQTT của 4 kết nối backend (mTLS)
      - ./infra/mosquitto/certs/clients:/certs/clients:ro
      # Firmware upload (FIRMWARE_STORAGE_DIR mặc định storage/firmware) — giữ qua mỗi lần tạo lại container.
      - firmware_data:/app/storage/firmware
      # Ảnh camera (SNAPSHOT_STORAGE_DIR mặc định storage/snapshots)
      - snapshot_data:/app/storage/snapshots
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      # Cùng nguồn với service postgres (.env gốc) — không phải khai báo mật khẩu 2 nơi.
      # Backend dùng role ứng dụng (không phải superuser).
      - DB_USER=${POSTGRES_APP_USER:-secure_smart_home_app}
      - DB_PASS=${POSTGRES_APP_PASSWORD:?Thiếu POSTGRES_APP_PASSWORD trong .env (xem .env.example)}
      - DB_NAME=${POSTGRES_DB:-secure_smart_home_iot}
      # Backend kết nối broker MQTT qua mTLS
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=8883
      - MQTT_CA_FILE=/certs/mqtt-ca.crt
      - MQTT_CLIENT_CERT_DIR=/certs/clients
      # Bắt buộc ở production: khoá AES-256-GCM mã hoá secret thiết bị khi lưu (FR-12.8). MẤT KHOÁ = đăng ký lại thiết bị.
      - DEVICE_SECRET_KEY=${DEVICE_SECRET_KEY:?Thiếu DEVICE_SECRET_KEY trong .env (openssl rand -hex 32)}
      - DEVICE_HMAC_V1=${DEVICE_HMAC_V1:-false}
      - FRONTEND_URL=https://localhost
      # Backend chỉ nhận request qua nginx (không publish cổng) → tin đúng 1 hop X-Forwarded-For để
      # req.ip là IP thật của client; thiếu dòng này mọi client chung IP nginx và rate limit khoá cả hệ thống.
      - TRUST_PROXY=1
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - iot-network
    restart: always

  # Frontend: 3 app Next.js trong frontend/ (npm workspaces), mỗi role một image.
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: admin
    container_name: iot-frontend-admin
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - iot-network
    restart: always

  frontend-operator:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: operator
    container_name: iot-frontend-operator
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - iot-network
    restart: always

  frontend-user:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: user
    container_name: iot-frontend-user
    environment:
      - BACKEND_URL=http://backend:5000
      - AGENT_URL=http://agent:8000
    depends_on:
      - backend
    networks:
      - iot-network
    restart: always

  # AI Agent (Trợ lý giọng nói/chữ) — không publish cổng; đường vào duy nhất là nginx `user.localhost/api/agent/`
  # → agent:8000/v1/. production bắt buộc OPENAI_API_KEY trong agent/.env, thiếu thì agent lỗi khởi động
  # và khởi động lại liên tục — chỉ /api/agent/ trả 502, nginx và các service khác vẫn chạy.
  agent:
    build:
      context: ./agent
    container_name: iot-agent
    env_file:
      - ./agent/.env
    environment:
      - AGENT_ENV=production
      - BACKEND_URL=http://backend:5000
    networks:
      - iot-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: iot-nginx
    ports:
      # 80 chỉ chuyển hướng sang 443 (NFR-S1)
      - "80:80"
      # HTTPS cho web, app Mobile và gateway — web.crt của infra/pki/gen_mqtt_certs.sh
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Chỉ cert + khoá web (không mount ca.key, không dùng chung khoá với broker)
      - ./infra/mosquitto/certs/web.crt:/etc/nginx/certs/web.crt:ro
      - ./infra/mosquitto/certs/web.key:/etc/nginx/certs/web.key:ro
    depends_on:
      - backend
      - frontend-admin
      - frontend-operator
      - frontend-user
      # Không phụ thuộc `agent`: agent lỗi chỉ làm /api/agent/ trả 502, phần còn lại vẫn chạy.
    networks:
      - iot-network
    restart: always

volumes:
  pg_data:
  firmware_data:
  snapshot_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  iot-network:
    driver: bridge
