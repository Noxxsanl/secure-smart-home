# Mosquitto MQTT Broker 2 - Gateway ↔ Backend layer
# Gateway Node publishes gateway/+/data here
# Backend subscribes gateway/+/data here
# Backend tracker reads $SYS/broker/log/N here for gateway IP tracking

# Chỉ có listener MQTT over TLS (FR-12.3, NFR-S1) — không còn cổng plaintext.
# Chứng chỉ sinh bằng scripts/gen_mqtt_certs.sh, mount từ mosquitto/certs/.
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# TLS xác thực server: client chưa cần chứng chỉ riêng (mTLS cho gateway là mục tiêu S).
require_certificate false
# FR-12.4 (chưa làm): tắt anonymous, credential + ACL riêng cho từng gateway.
allow_anonymous true

# Logging (log_dest topic enables $SYS/broker/log/N – needed by mqttTracker)
log_type all
log_dest stdout
log_dest topic

# Persistence
persistence true
persistence_location /mosquitto/data/
