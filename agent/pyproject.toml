[project]
name = "smarthome-agent"
version = "0.1.0"
description = "AI Agent trợ lý điều khiển Smart Home (tiếng Việt, human-in-the-loop)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
# Chỉ cài khi STT_PROVIDER=whisper_local (nặng, cần ffmpeg)
stt-local = ["faster-whisper>=1.0"]

[project.scripts]
smarthome-agent = "smarthome_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smarthome_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
# FastAPI dùng Header(...)/Depends(...) làm giá trị mặc định — đúng idiom, không phải lỗi B008.
ignore = ["B008"]
