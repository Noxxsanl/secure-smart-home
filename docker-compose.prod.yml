services:
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env (xem .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-secure_smart_home_iot}
      MYSQL_USER: ${MYSQL_USER:-secure_smart_home_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong .env (xem .env.example)}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - iot-network
    healthcheck:
      # Đọc biến trong container — không để mật khẩu trong docker inspect
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u \"$$MYSQL_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker 1: Sensor Node → Gateway Node (port 1883)
  mqtt-broker-1:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto-1
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/broker1/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto1_data:/mosquitto/data
      - mosquitto1_logs:/mosquitto/log
    networks:
      - iot-network

  # Broker 2: Gateway Node → Backend — chỉ MQTT over TLS (port 8883)
  # Chạy scripts/gen_mqtt_certs.sh <IP/hostname broker> trước lần up đầu tiên.
  mqtt-broker-2:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto-2
    restart: always
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/broker2/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # ca.key không mount vào container nào
      - ./mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto2_data:/mosquitto/data
      - mosquitto2_logs:/mosquitto/log
    networks:
      - iot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/mqtt-ca.crt:ro
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      # Cùng nguồn với service mysql (.env gốc) — không phải khai báo mật khẩu 2 nơi
      - DB_USER=${MYSQL_USER:-secure_smart_home_app}
      - DB_PASS=${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong .env (xem .env.example)}
      - DB_NAME=${MYSQL_DATABASE:-secure_smart_home_iot}
      # Backend chỉ kết nối Broker 2 (gateway → backend layer) qua TLS
      - MQTT_HOST=mqtt-broker-2
      - MQTT_PORT=8883
      - MQTT_CA_FILE=/certs/mqtt-ca.crt
      - FRONTEND_URL=http://localhost
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-broker-2:
        condition: service_started
    networks:
      - iot-network
    restart: always

  # Frontend: 3 app Next.js trong frontend/ (npm workspaces), mỗi role một image.
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: admin
    container_name: iot-frontend-admin
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - iot-network
    restart: always

  frontend-operator:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: operator
    container_name: iot-frontend-operator
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - iot-network
    restart: always

  frontend-user:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: user
    container_name: iot-frontend-user
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - iot-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: iot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend-admin
      - frontend-operator
      - frontend-user
    networks:
      - iot-network
    restart: always

volumes:
  mysql_data:
  mosquitto1_data:
  mosquitto1_logs:
  mosquitto2_data:
  mosquitto2_logs:

networks:
  iot-network:
    driver: bridge
