# WebSocket: chỉ gửi "Connection: upgrade" khi client xin nâng cấp — app mobile (/api/mobile/ws,
# backend ping 30 s nên proxy_read_timeout 60s không cắt kết nối rảnh) và HMR của Next dev.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:5000;
}

# Mỗi role một app Next.js, phục vụ trên subdomain riêng để 3 cổng không dùng
# chung origin (cookie/localStorage của cổng khách hàng không chạm tới console
# quản trị). Trình duyệt tự phân giải *.localhost về 127.0.0.1.
upstream frontend_admin {
    server frontend-admin:3000;
}

upstream frontend_operator {
    server frontend-operator:3000;
}

upstream frontend_user {
    server frontend-user:3000;
}

# Admin — mặc định cho http://localhost (giữ URL cũ của Dashboard)
server {
    listen 80 default_server;
    server_name localhost admin.localhost;

    client_max_body_size 10M;

    # API requests (gồm WebSocket /api/mobile/ws) → backend trực tiếp
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://frontend_admin;
        proxy_http_version 1.1;
        # WebSocket cho Next.js HMR (hot reload trong dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# Operator
server {
    listen 80;
    server_name operator.localhost;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://frontend_operator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# User (khách hàng)
server {
    listen 80;
    server_name user.localhost;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://frontend_user;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# HTTPS cho thiết bị (FR-12.3): Gateway ESP32-S3 gửi ảnh camera (POST /api/device/camera/snapshot) và đường
# dự phòng POST /api/device/data qua https://<IP LAN>. Dùng chung server cert với Broker MQTT do
# infra/pki/gen_mqtt_certs.sh <IP LAN> cấp (SAN có IP LAN); gateway kiểm chứng bằng CA nội bộ đã nhúng —
# không bao giờ bỏ kiểm chứng (bất biến 3). Trình duyệt không tin CA này: giao diện web vẫn dùng cổng 80.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    # Ảnh ≤ 200 KB (backend kiểm lại và trả 413); chặn sớm thân quá lớn ở proxy.
    client_max_body_size 512k;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        return 404;
    }
}
