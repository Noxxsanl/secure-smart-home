# Mosquitto MQTT Broker — Gateway ↔ Backend (broker duy nhất; Node ↔ Gateway đi ESP-NOW)
# Gateway publish telemetry/heartbeat/ack/camera event, Backend subscribe + publish lệnh.
#
# Chỉ MQTT over TLS hai chiều (mTLS) — FR-12.3, FR-12.4, NFR-S1:
#   - mọi client phải trình chứng chỉ do CA nội bộ ký (infra/pki/gen_mqtt_certs.sh cho backend,
#     infra/pki/gen_mqtt_client.sh <gateway_id> cho từng gateway); không có chứng chỉ → không bắt tay TLS được;
#   - CN của chứng chỉ là username (use_identity_as_username) VÀ client id (use_username_as_clientid): không kết nối
#     ẩn danh, không đổi tên để đọc topic người khác, không chiếm client id của backend/gateway khác;
#   - ACL (acl) giới hạn mỗi gateway trong topic của chính nó, mỗi kết nối backend trong đúng topic nó cần;
#   - ca.crl: chứng chỉ bị thu hồi (gen_mqtt_client.sh --revoke) — đổi CRL thì khởi động lại broker.
# Không còn publish log ra topic $SYS/broker/log (trước đây ai kết nối được cũng đọc thấy client id + IP).

per_listener_settings false
allow_anonymous false
acl_file /mosquitto/config/acl

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
crlfile  /mosquitto/certs/ca.crl
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
use_username_as_clientid true

# Logging: chỉ ra stdout (docker logs), không ra topic
log_type error
log_type warning
log_type notice
log_type information
log_dest stdout

# Persistence
persistence true
persistence_location /mosquitto/data/
